services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab402
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab402']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab402
      PORT: 8080
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
        NEXT_PUBLIC_API_PUBLIC_URL: http://localhost:${API_PORT:-8080}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  # Panel on MSW fixtures and a mock wallet: no API, no Postgres, no devnet USDC.
  web-mock:
    profiles: [mock]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_MOCK_PORT:-3001}
        NEXT_PUBLIC_API_MOCKING: enabled
    ports:
      - '${WEB_MOCK_PORT:-3001}:3000'

volumes:
  postgres-data:
